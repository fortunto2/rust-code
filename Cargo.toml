[workspace]
members = [
    "crates/rc-cli",
    "crates/solograph",
    "crates/sgr-agent-core",
    "crates/sgr-agent",
    "crates/sgr-agent-tools",
    "crates/sgr-agent-tui",
    "crates/sgr-agent-ml",
    "crates/autoresearch",
]
default-members = ["crates/rc-cli"]
# Vendored fork, and nothing depends on it by path (sgr-agent uses the published
# genai). Declaring it excluded rather than merely unlisted is what lets
# `cargo test --manifest-path crates/genai/Cargo.toml` run at all — without it
# cargo refuses the manifest and `make test`'s genai step only ever printed an
# error.
exclude = ["crates/genai"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"

# UI / CLI
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28" # matches tui-textarea 0.7 and ratatui 0.29's crossterm
tui-textarea = "0.7" # 0.7+ declares ratatui ^0.29 (closed range) — resolver can't pull 0.30; fixes #4 for unlocked installs
# Fuzzy matcher: Smith-Waterman SIMD; shared with fff-search for single engine.
neo_frizbee = "0.10"

# Tools / Core
ignore = "0.4" # for fast directory traversal / gitignore support
rmcp = { version = "0.11.0", features = ["client", "transport-io", "transport-child-process"] }
fff-search = "0.6.1" # fast fuzzy file finder with frecency + query history (dmtrKovalenko/fff.nvim). Pure-Rust globset backend; zlob (Zig) requires a specific Zig version and is skipped.
